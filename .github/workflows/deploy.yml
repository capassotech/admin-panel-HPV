name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        if: github.ref == 'refs/heads/main'
        run: npm run build

      - name: Build (development)
        if: github.ref == 'refs/heads/develop'
        run: npm run build:dev

      - name: Deploy to Firebase (production)
        if: github.ref == 'refs/heads/main'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HOME_PISOS_VINILICOS_ADMIN_PROD }}
          channelId: live
          projectId: home-pisos-admin

      - name: Deploy to Firebase (development)
        if: github.ref == 'refs/heads/develop'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HPV_DESARROLLO_ADMIN_QA }}
          channelId: live
          projectId: home-pisos-admin-qa
